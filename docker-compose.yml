services:
  datatalk-bi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datatalk-enterprise-bi
    ports:
      - "8504:8504"
    env_file:
      - .env
    volumes:
      - ./workspaces:/app/workspaces
      - datatalk-secrets:/app/.secrets
    restart: unless-stopped

volumes:
  datatalk-secrets:
