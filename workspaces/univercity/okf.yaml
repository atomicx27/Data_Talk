measures:
- id: meas_recognized_net_revenue
  name: Recognized Net Revenue
  table_name: orders
  description: Total Net Revenue in USD excluding Cancelled ('X') orders.
  format_string: '#,##0.00'
  user_input_type: dax
  dax_expression: CALCULATE(SUM(orders[rev_net_usd]), orders[ord_stat] <> "X")
  sql_expression: SUM(CASE WHEN orders.ord_stat <> 'X' THEN orders.rev_net_usd ELSE
    0 END)
  involved_tables:
  - orders
  verified: false
  sample_value: null
  synonyms: []
- id: meas_gross_margin
  name: Gross Margin %
  table_name: orders
  description: Profit divided by Net Revenue across active orders.
  format_string: '#,##0.00'
  user_input_type: dax
  dax_expression: DIVIDE(SUM(orders[profit_usd]), SUM(orders[rev_net_usd]), 0)
  sql_expression: COALESCE((SUM(orders.profit_usd)) / NULLIF((SUM(orders.rev_net_usd)),
    0), 0)
  involved_tables:
  - orders
  verified: false
  sample_value: null
  synonyms: []
- id: meas_average_order_value_aov
  name: Average Order Value (AOV)
  table_name: orders
  description: Recognized Net Revenue divided by distinct completed/pending orders.
  format_string: '#,##0.00'
  user_input_type: dax
  dax_expression: DIVIDE(CALCULATE(SUM(orders[rev_net_usd]), orders[ord_stat] <> "X"),
    DISTINCTCOUNT(orders[order_id]), 0)
  sql_expression: COALESCE((SUM(CASE WHEN orders.ord_stat <> 'X' THEN orders.rev_net_usd
    ELSE 0 END)) / NULLIF((COUNT(DISTINCT orders.order_id)), 0), 0)
  involved_tables:
  - orders
  verified: false
  sample_value: null
  synonyms: []
