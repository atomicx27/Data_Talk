[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datatalk-bi"
version = "2.5.0"
description = "Governed Conversational Business Intelligence, Semantic Layer Studio & Bidirectional DAX <-> SQL Compiler"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Data_Talk Core Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Database",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "S101",   # assert used in tests
    "S105",   # possible hardcoded password (test tokens)
    "S106",
    "S608",   # SQL injection alerts where intentional AST / push-down query generation is sanitized
    "B008",   # Depends in argument defaults (FastAPI standard)
    "E501",   # line too long (checked by formatter)
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["src.security.*", "src.knowledge.rag_store"]
disallow_untyped_defs = true
